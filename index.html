<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Operacional</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
video{width:100vw;height:100vh;object-fit:contain;display:block;background:#000}
</style>
</head>
<body>
<video id="player" autoplay muted playsinline preload="auto"></video>
<script>
const videos=["PAINEL.mp4","PAINEL2.mp4"];
const player=document.getElementById("player");
let atual=0;

function tocarAtual(){
  player.src=videos[atual];
  player.load();
  const p=player.play();
  if(p) p.catch(()=>{});
}

player.addEventListener("ended",()=>{
  atual=(atual+1)%videos.length;
  tocarAtual();
});

player.addEventListener("pause",()=>{
  setTimeout(()=>{
    if(player.paused){
      const p=player.play();
      if(p) p.catch(()=>{});
    }
  },500);
});

player.addEventListener("error",()=>{
  setTimeout(tocarAtual,2000);
});

window.addEventListener("load",tocarAtual);
</script>
</body>
</html>
