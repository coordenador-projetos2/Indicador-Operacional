<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel TV</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    video {
      display: block;
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      background: #000;
    }
  </style>
</head>
<body>
  <video
    id="painel"
    autoplay
    muted
    loop
    playsinline
    preload="auto"
  >
    <source src="PAINEL.mp4" type="video/mp4">
    Seu navegador não suporta reprodução de vídeo HTML5.
  </video>

  <script>
    const video = document.getElementById("painel");

    // Mantém a reprodução ativa e tenta recuperar automaticamente
    // caso o navegador interrompa o vídeo.
    video.muted = true;

    function iniciarVideo() {
      const promessa = video.play();
      if (promessa) {
        promessa.catch(() => {
          // Alguns navegadores bloqueiam autoplay temporariamente.
        });
      }
    }

    video.addEventListener("ended", () => {
      video.currentTime = 0;
      iniciarVideo();
    });

    video.addEventListener("pause", () => {
      setTimeout(iniciarVideo, 500);
    });

    video.addEventListener("error", () => {
      setTimeout(() => {
        video.load();
        iniciarVideo();
      }, 2000);
    });

    window.addEventListener("load", iniciarVideo);
  </script>
</body>
</html>
