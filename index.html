<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Painel Operacional</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        #painel {
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }

        #slide {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            background: #000;
        }

        #erro {
            display: none;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 30px;
        }

        #erro h1 {
            font-size: 32px;
            margin-bottom: 15px;
        }

        #erro p {
            font-size: 20px;
            line-height: 1.5;
        }
    </style>
</head>

<body>

    <div id="painel">
        <img id="slide" src="" alt="Painel Operacional">

        <div id="erro">
            <h1>Erro ao carregar o painel</h1>
            <p>Verifique se os arquivos Slide1.png, Slide2.PNG e Slide3.PNG estão no mesmo local que o index.html.</p>
        </div>
    </div>

    <script>

        // ==========================================================
        // ARQUIVOS DO PAINEL
        // ==========================================================

        const slides = [
            "Slide1.png",
            "Slide2.png",
            "Slide3.png",
            "Slide4.png",
            "Slide5.png", 
            "Slide6.png",
        ];


        // ==========================================================
        // CONFIGURAÇÃO
        // ==========================================================

        let indiceAtual = 0;

        // Tempo de cada slide em milissegundos
        // 10000 = 10 segundos
        const tempoSlide = 10000;

        const imagem = document.getElementById("slide");
        const erro = document.getElementById("erro");


        // ==========================================================
        // CARREGAR SLIDE
        // ==========================================================

        function carregarSlide() {

            imagem.src = slides[indiceAtual];

            console.log("Carregando:", slides[indiceAtual]);

        }


        // ==========================================================
        // QUANDO A IMAGEM CARREGAR
        // ==========================================================

        imagem.onload = function () {

            console.log("Slide carregado:", imagem.src);

            imagem.style.display = "block";
            erro.style.display = "none";

        };


        // ==========================================================
        // SE A IMAGEM DER ERRO
        // ==========================================================

        imagem.onerror = function () {

            console.error("Erro ao carregar:", slides[indiceAtual]);

            imagem.style.display = "none";
            erro.style.display = "block";

        };


        // ==========================================================
        // TROCAR SLIDE
        // ==========================================================

        function proximoSlide() {

            indiceAtual++;

            if (indiceAtual >= slides.length) {
                indiceAtual = 0;
            }

            carregarSlide();

        }


        // ==========================================================
        // INICIAR PAINEL
        // ==========================================================

        carregarSlide();


        // ==========================================================
        // LOOP AUTOMÁTICO
        // ==========================================================

        setInterval(proximoSlide, tempoSlide);


        // ==========================================================
        // RECARREGAMENTO AUTOMÁTICO
        // ==========================================================
        // A cada 30 minutos a página é recarregada.
        // Isso ajuda a atualizar os indicadores na TV.

        setInterval(function () {

            location.reload();

        }, 1800000);


    </script>

</body>
</html>
