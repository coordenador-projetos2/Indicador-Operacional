<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Operacional</title>
  <style>
    html,body{
      margin:0;
      padding:0;
      width:100%;
      height:100%;
      overflow:hidden;
      background:#000;
    }
    video{
      width:100vw;
      height:100vh;
      object-fit:contain;
      display:block;
      background:#000;
    }
  </style>
</head>
<body>

<video id="player" autoplay playsinline preload="auto"></video>

<script>
  // Coloque os vídeos nesta ordem.
  const videos = [
    "PAINEL.mp4",
    "PAINEL2.mp4"
  ];

  const player = document.getElementById("player");
  let atual = 0;
  let tentandoSom = true;

  function tocarAtual() {
    player.src = videos[atual];
    player.load();

    // IMPORTANTE: não usamos "muted".
    // O navegador tentará iniciar o vídeo com áudio.
    player.muted = false;

    const tentativa = player.play();

    if (tentativa) {
      tentativa.catch(() => {
        // Se a TV bloquear autoplay com áudio, tenta novamente
        // sem som para que o painel continue funcionando.
        tentandoSom = false;
        player.muted = true;
        const fallback = player.play();
        if (fallback) fallback.catch(() => {});
      });
    }
  }

  player.addEventListener("ended", () => {
    atual = (atual + 1) % videos.length;

    // Volta a tentar áudio a cada novo vídeo.
    tentandoSom = true;
    tocarAtual();
  });

  player.addEventListener("error", () => {
    setTimeout(() => {
      atual = (atual + 1) % videos.length;
      tocarAtual();
    }, 1500);
  });

  // Se a reprodução for pausada inesperadamente, tenta recuperar.
  player.addEventListener("pause", () => {
    if (!player.ended) {
      setTimeout(() => {
        if (player.paused) {
          const tentativa = player.play();
          if (tentativa) tentativa.catch(() => {});
        }
      }, 700);
    }
  });

  window.addEventListener("load", tocarAtual);
</script>

</body>
</html>
